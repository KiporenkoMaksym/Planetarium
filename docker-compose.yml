services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - media_volume:/app/media
      - static_volume:/app/static
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    depends_on:
      - db
    command: >
      sh -c "
        python app_service/manage.py wait_for_db &&
        python app_service/manage.py migrate &&
        python app_service/manage.py runserver 0.0.0.0:8000
      "

  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env

volumes:
  postgres_data:
  media_volume:
  static_volume: